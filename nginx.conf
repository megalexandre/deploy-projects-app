server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O shell da SPA precisa ser sempre revalidado para nao apontar para
    # bundles de uma versao anterior depois de um novo deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Este arquivo e gerado na inicializacao do container e pode mudar sem
    # que os bundles sejam recompilados.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
