server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Support builds that use /deploy-projects-app/ as Vite base.
    location = /deploy-projects-app {
        return 301 /deploy-projects-app/;
    }

    location /deploy-projects-app/ {
        rewrite ^/deploy-projects-app/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
